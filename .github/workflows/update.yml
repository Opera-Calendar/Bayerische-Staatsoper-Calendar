
name: Update Munich opera calendars

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Update calendars
        run: python test_operabook.py

      - name: Commit changed calendars
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bayerische-staatsoper.ics bayerische-staatsoper-vorverkauf.ics
          git diff --cached --quiet || (git commit -m 'Update Munich opera calendars' && git push)
