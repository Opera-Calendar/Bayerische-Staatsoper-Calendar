name: Update Munich opera calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate opera calendar
        run: python operabook_calendar.py
      - name: Commit calendar if changed
        run: |
          if [ -f bayerische-staatsoper.ics ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bayerische-staatsoper.ics
            if ! git diff --cached --quiet; then
              git commit -m 'Update Munich opera calendar'
              git push
            fi
          else
            echo 'No calendar created; stopping without committing'
            exit 1
          fi
