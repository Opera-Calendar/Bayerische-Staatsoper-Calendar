name: Check Operabase duration extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Check production-specific duration text
        shell: bash
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          # Two concrete Munich productions: one has a published duration,
          # the other did not have an obvious one in the previous test.
          targets = {
              'Un ballo in maschera (3 Nov 2026)': 'https://www.operabase.com/productions/un-ballo-in-maschera-663751/03-november-2026/de',
              'Siegfried (season 2026/27)': 'https://www.operabase.com/productions/siegfried-611676/de',
          }
          patterns = [
              re.compile(r'(?<!\d)(\d{1,2})\s*h\s*(\d{1,2})\s*(?:min\.?|minutes?\b)', re.I),
              re.compile(r'(?<!\d)(\d{1,2})\s*(?:Std\.?|Stunden?)\s*(\d{1,2})\s*(?:Min\.?|Minuten?)', re.I),
              re.compile(r'(?<!\d)(\d{1,3})\s*(?:Min\.?|Minuten?)\b', re.I),
          ]
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 (compatible; PersonalOperaCalendar/1.0)'})
          for name, url in targets.items():
              print('\n===', name, '===', flush=True)
              try:
                  response = session.get(url, timeout=25)
                  print('HTTP:', response.status_code, 'bytes:', len(response.content), 'URL:', response.url)
                  response.raise_for_status()
                  soup = BeautifulSoup(response.text, 'html.parser')
                  for tag in soup(['script', 'style', 'noscript']):
                      tag.decompose()
                  visible = soup.get_text(' ', strip=True)
                  matches = []
                  for pattern in patterns:
                      for match in pattern.finditer(visible):
                          context = visible[max(0, match.start()-65):match.end()+65]
                          matches.append((match.group(0), context))
                  print('Duration candidates:', len(matches))
                  for raw, context in matches[:12]:
                      print('  ', repr(raw), '| context:', repr(context))
                  if not matches:
                      print('NO VERIFIED DURATION FOUND (do not use a guessed end time)')
              except requests.RequestException as exc:
                  print('REQUEST FAILED:', type(exc).__name__, str(exc)[:300])
          print('\nDiagnostic only: no ICS file changed.')
          PY
