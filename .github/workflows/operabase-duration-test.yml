name: Test Operabase production durations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Check Operabase access and duration text
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          urls = {
              'Siegfried production': 'https://www.operabase.com/productions/siegfried-611676/de',
              'Munich opera overview': 'https://www.operabase.com/bavarian-state-opera-o9476/de',
              'Munich orchestra overview': 'https://www.operabase.com/bavarian-state-orchestra-o10883/de',
          }
          pat = re.compile(r'(?:\d+\s*h\s*\d*\s*(?:Min\.|mins?)?|\d+\s*Stunden?\s*(?:\d+\s*Minuten?)?|\d+\s*hours?\s*(?:\d+\s*minutes?)?)', re.I)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 (compatible; OperaCalendarDurationTest/1.0)'})
          for name, url in urls.items():
              print(f'\n=== {name} ===', flush=True)
              try:
                  r = session.get(url, timeout=25)
                  print(f'HTTP {r.status_code}; bytes={len(r.content)}; final URL={r.url}', flush=True)
                  if r.ok:
                      soup = BeautifulSoup(r.text, 'html.parser')
                      for el in soup(['script', 'style', 'nav', 'footer']):
                          el.decompose()
                      txt = soup.get_text(' ', strip=True)
                      print('Page title:', soup.title.get_text(' ', strip=True) if soup.title else '(none)')
                      hits = pat.findall(txt)
                      print('Duration mentions (first 20):', hits[:20])
                      print('Text excerpt:', txt[:550])
                  else:
                      print('Access denied or unavailable. No duration inferred.')
              except Exception as e:
                  print(type(e).__name__, str(e)[:400])
          print('\nTEST COMPLETE. No calendar files changed.')
          PY
